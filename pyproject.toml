[project]
name = "kiba-core"
version = "0.5.2"
description = "Kiba Labs' python utilities"
readme = "README.md"
requires-python = ">=3.12, <4"
dependencies = [
    "aiofiles>=25.1.0",
    "pydantic>=2.14.1",
    "orjson>=3.13.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
]
core-api = [
    "starlette>=1.7.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.29",
]
storage = [
    "aiobotocore>=3.9.2",
]
# TODO(krishan711): remove this in next major update
queues = [
    "aiobotocore>=3.9.2",
]
queue-sqs = [
    "aiobotocore>=3.9.2",
]
queue-aqs = [
    "azure-storage-queue[aio]>=12.18.0",
]
queue-cosmos = [
    "azure-cosmos>=4.17.1",
]
database-psql = [
    "sqlalchemy[asyncio]>=2.1.4",
    "asyncpg>=0.32.0",
]
database-sqlite = [
    "sqlalchemy[asyncio]>=2.1.4",
    "aiosqlite>=0.22.1",
]
requester = [
    "httpx2>=2.13.1",
]
web3 = [
    "web3>=7.16.0,<8.0.0",
]
cron = [
    "apscheduler>=3.11.3,<4",
]
types = [
    "types-aiobotocore[essential]>=3.9.2",
    "types-aiofiles>=25.1.0.20260518",
]

[dependency-groups]
dev = [
    "kiba-build==0.1.11.dev19",
]

[project.urls]
repository = "https://github.com/kibalabs/core-py"

[tool.uv]
package = true

[build-system]
requires = ["setuptools", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
core = ["/py.typed", "**/config.toml"]
